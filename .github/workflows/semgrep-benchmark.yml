name: Semgrep Benchmark

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/semgrep-benchmark.yml'
      - 'benchmarks/Semgrep/**'
      - 'src/**'
      - 'build.gradle'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: semgrep-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner and test tools
        run: python -m pip install semgrep==1.178.0 pytest==8.4.2

      - name: Test converter
        run: python -m pytest benchmarks/Semgrep/scripts/ -q

      - name: Build application from scanned checkout
        run: ./gradlew bootJar --no-daemon

      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep-benchmark"
          echo "BENCHMARK_DIR=$RUNNER_TEMP/semgrep-benchmark" >> "$GITHUB_ENV"

      - name: Scan source
        run: |
          semgrep scan --config p/default --metrics=off --timeout 30 --json \
            --output "$BENCHMARK_DIR/semgrep-raw-report.json" src/main/java

      - name: Convert findings
        run: |
          python benchmarks/Semgrep/scripts/convert_semgrep_to_benchmark.py \
            --input "$BENCHMARK_DIR/semgrep-raw-report.json" \
            --output "$BENCHMARK_DIR/semgrep-findings.json"

      - name: Start application and wait for ground truth
        run: |
          java -jar build/libs/VulnerableApp-1.0.0.jar \
            --server.address=127.0.0.1 \
            --benchmark.output.dir="$RUNNER_TEMP/semgrep-benchmark-output" \
            > "$BENCHMARK_DIR/vulnerableapp.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vulnerableapp.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:9090/VulnerableApp/scanner/sast > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/vulnerableapp.pid")" 2>/dev/null; then
              cat "$BENCHMARK_DIR/vulnerableapp.log"
              exit 1
            fi
            sleep 2
          done
          cat "$BENCHMARK_DIR/vulnerableapp.log"
          exit 1

      - name: Score findings
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            -X POST http://localhost:9090/VulnerableApp/scanner/benchmark \
            -H 'Content-Type: application/json' \
            --data-binary @"$BENCHMARK_DIR/semgrep-findings.json" \
            --output "$BENCHMARK_DIR/semgrep-results.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ['BENCHMARK_DIR']) / 'semgrep-results.json').read_text())
          fields = ('totalExpected', 'detected', 'missed', 'unmatched')
          if result.get('tool') != 'Semgrep' or result.get('persistenceError'):
              raise SystemExit('Benchmark did not return a successful Semgrep result')
          if any(type(result.get(field)) is not int or result[field] < 0 for field in fields):
              raise SystemExit('Benchmark returned invalid counts')
          if result['totalExpected'] != result['detected'] + result['missed']:
              raise SystemExit('Benchmark returned inconsistent counts')
          summary = '\n'.join(f'- {field}: {result[field]}' for field in fields)
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Semgrep benchmark\n\n' + summary + '\n')
          PY

      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vulnerableapp.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/vulnerableapp.pid")" 2>/dev/null || true
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-benchmark-${{ github.run_id }}
          retention-days: 30
          path: ${{ runner.temp }}/semgrep-benchmark/
